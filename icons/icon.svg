<!-- Pixel Mosaic Tool アプリアイコン (SVGベクター版) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- アクセントグラデーション (#7b5cff -> #00d4ff) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161a" />
      <stop offset="100%" stop-color="#0d0d0f" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b5cff" />
      <stop offset="100%" stop-color="#00d4ff" />
    </linearGradient>
  </defs>

  <!-- 角丸ダーク背景 -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-opacity="0.45" />

  <!-- ピクセルモザイクを表現する4x4グリッドタイル -->
  <g transform="translate(88, 88)">
    <!-- 1行目 -->
    <rect x="0"   y="0"   width="76" height="76" rx="10" fill="#7b5cff" fill-opacity="0.95" />
    <rect x="86"  y="0"   width="76" height="76" rx="10" fill="#6574ff" fill-opacity="0.75" />
    <rect x="172" y="0"   width="76" height="76" rx="10" fill="#4895ff" fill-opacity="0.90" />
    <rect x="258" y="0"   width="76" height="76" rx="10" fill="#23b4ff" fill-opacity="0.55" />

    <!-- 2行目 -->
    <rect x="0"   y="86"  width="76" height="76" rx="10" fill="#6b68ff" fill-opacity="0.65" />
    <rect x="86"  y="86"  width="76" height="76" rx="10" fill="#7b5cff" fill-opacity="1.00" />
    <rect x="172" y="86"  width="76" height="76" rx="10" fill="#00d4ff" fill-opacity="0.85" />
    <rect x="258" y="86"  width="76" height="76" rx="10" fill="#3aa6ff" fill-opacity="0.80" />

    <!-- 3行目 -->
    <rect x="0"   y="172" width="76" height="76" rx="10" fill="#5289ff" fill-opacity="0.85" />
    <rect x="86"  y="172" width="76" height="76" rx="10" fill="#2cb0ff" fill-opacity="0.90" />
    <rect x="172" y="172" width="76" height="76" rx="10" fill="#00d4ff" fill-opacity="1.00" />
    <rect x="258" y="172" width="76" height="76" rx="10" fill="#00b8e6" fill-opacity="0.65" />

    <!-- 4行目 -->
    <rect x="0"   y="258" width="76" height="76" rx="10" fill="#3b9eff" fill-opacity="0.50" />
    <rect x="86"  y="258" width="76" height="76" rx="10" fill="#18c0ff" fill-opacity="0.75" />
    <rect x="172" y="258" width="76" height="76" rx="10" fill="#00c8f8" fill-opacity="0.80" />
    <rect x="258" y="258" width="76" height="76" rx="10" fill="#00d4ff" fill-opacity="0.95" />
  </g>

  <!-- 選択枠オーバーレイ表現 -->
  <rect x="166" y="166" width="180" height="180" rx="14" fill="none" stroke="#ffffff" stroke-width="6" stroke-dasharray="16 10" />
</svg>
